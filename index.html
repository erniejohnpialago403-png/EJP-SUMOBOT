<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sumobot</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#e9ecf1}
main{max-width:420px;margin:0 auto;padding:16px}
h1{font-size:20px;letter-spacing:2px;margin:0 0 12px}
#st{padding:14px;border-radius:12px;text-align:center;font-weight:700;font-size:20px;letter-spacing:2px;background:#191c23;border:1px solid #262a33}
#st.on{color:#1fbf6a;border-color:#1fbf6a}#st.wait{color:#f5a524;border-color:#f5a524}
button,select,input{font:inherit;border-radius:12px;border:1px solid #262a33}
button:disabled,select:disabled,input:disabled{opacity:.4}
#conn{width:100%;padding:14px 0;margin-top:12px;border:0;color:#fff;font-size:17px;font-weight:700;letter-spacing:1px;background:#3b82f6}
#go{width:100%;padding:22px 0;margin-top:12px;border:0;color:#fff;font-size:22px;font-weight:800;letter-spacing:2px;background:#1fbf6a}
label{display:block;margin:20px 0 6px;font-size:12px;color:#8b93a1;text-transform:uppercase;letter-spacing:1.5px}
select,input{width:100%;box-sizing:border-box;padding:12px;background:#191c23;color:#e9ecf1}
#lim,#msg{font-size:12px;color:#8b93a1;margin-top:6px}
#lim{margin-top:10px}
#msg{color:#f5a524;min-height:1em}
</style></head><body><main>
<h1>SUMOBOT</h1>
<div id="st">NOT CONNECTED</div>
<button id="conn">CONNECT (Bluetooth)</button>
<div id="msg"></div>
<button id="go" disabled>START</button>
<label for="mode">Mode</label>
<select id="mode" disabled>
<option value="m0">Search &amp; Destroy</option>
<option value="m1">Spin Search</option>
<option value="m2">Arc Search</option>
<option value="m3">Sneaky Little Bastard</option>
<option value="m4">Straight Ahead</option>
<option value="m5">Right 90</option>
<option value="m6">Left 90</option>
<option value="m7">Forward + 180</option>
</select>
<div id="lim"></div>
</main><script>
// Bluetooth Low Energy "Nordic UART Service" - same as in the robot code
const NUS="6e400001-b5a3-f393-e0a9-e50e24dcca9e",RX="6e400002-b5a3-f393-e0a9-e50e24dcca9e",TX="6e400003-b5a3-f393-e0a9-e50e24dcca9e";
const $=id=>document.getElementById(id),S=["STANDBY","ACTIVE","STARTING..."],C=["","on","wait"];
let dev=null,rx=null,chain=Promise.resolve(),wanted=false,retry=0,lastMsg=0;
const enc=new TextEncoder(),dec=new TextDecoder();

function ui(connected){
  ["go","mode"].forEach(i=>$(i).disabled=!connected);
  $("conn").style.display=connected?"none":"block";
  if(!connected){$("st").textContent="NOT CONNECTED";$("st").className="";}
}
function msg(t){$("msg").textContent=t||"";}

// one write at a time (Bluetooth can't do two at once)
function write(c){return rx.writeValueWithResponse?rx.writeValueWithResponse(enc.encode(c)):rx.writeValue(enc.encode(c));}
function send(c){
  if(!rx) return;
  const tryIt=n=>write(c).then(()=>{ if($("msg").textContent.startsWith("Send failed")) msg(""); })
    .catch(e=>{ if(n<2&&rx) return new Promise(r=>setTimeout(r,150)).then(()=>tryIt(n+1)); msg("Send failed: "+e.message); });
  chain=chain.then(()=>tryIt(0));
}

function onData(e){
  const t=dec.decode(e.target.value).trim(); lastMsg=Date.now();
  if(t[0]==="S"){const [st,m]=t.slice(1).split(",").map(Number);
    $("st").textContent=S[st]||"?";$("st").className=C[st]||"";
    if(document.activeElement!==$("mode"))$("mode").value="m"+m;}
  else if(t[0]==="L"){const l=t.slice(1).split(",");
    $("lim").textContent="Attacks within "+l[0]+" mm (all 5 sensors)";}
}

async function link(){
  const srv=await dev.gatt.connect();
  const svc=await srv.getPrimaryService(NUS);
  rx=await svc.getCharacteristic(RX);
  const tx=await svc.getCharacteristic(TX);
  await tx.startNotifications();
  tx.addEventListener("characteristicvaluechanged",onData);
  retry=0; msg(""); ui(true); send("?");
}

async function connect(){
  if(!navigator.bluetooth){msg("This browser has no Bluetooth. Use Chrome or Edge (Android / PC) or the Bluefy browser (iPhone), and open this page from an https:// address.");return;}
  try{
    dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:"SUMOBOT"},{services:[NUS]}],optionalServices:[NUS]});
    dev.addEventListener("gattserverdisconnected",lost);
    wanted=true; msg("Connecting..."); await link();
  }catch(e){ if(e.name!=="NotFoundError") msg("Could not connect: "+e.message); else msg(""); }
}

// robot switched off / out of range: try to get it back by itself
async function lost(){
  rx=null; ui(false);
  if(!wanted||!dev) return;
  if(retry++<15){ msg("Connection lost - reconnecting ("+retry+")..."); setTimeout(()=>link().catch(lost),2000); }
  else msg("Robot not found. Tap CONNECT to try again.");
}

$("conn").onclick=()=>{retry=0;connect();};
$("go").onclick=()=>send("start");
$("mode").onchange=e=>send(e.target.value);
// no status for 4 s while connected -> show it
setInterval(()=>{ if(rx&&Date.now()-lastMsg>4000){ $("st").textContent="NO DATA";$("st").className=""; send("?"); } },2000);
ui(false);
if(!navigator.bluetooth) msg("This browser has no Bluetooth. Use Chrome or Edge (Android / PC) or the Bluefy browser (iPhone), and open this page from an https:// address.");
</script></body></html>
